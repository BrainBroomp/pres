<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вся жизнь напоказ незнакомцам — родительская консультация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F0;
    --white:#FFFFFF;
    --ink:#141B2E;
    --ink-soft:#4B566B;
    --muted:#7E8899;
    --line:rgba(20,27,46,.10);
    --coral:#FF6B5A;
    --amber:#F5B942;
    --teal:#20B2A5;
    --blue:#3D7BD9;
    --violet:#8172E8;
    --danger:#E5484D;
    --shadow:0 14px 38px rgba(20,27,46,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:#080D19;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

  /* ---------- App shell ---------- */
  .app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#1B2444 0%,#080D19 65%)}
  .viewport{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center}
  .stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;will-change:transform}
  .deck{width:100%;height:100%}

  /* ---------- Slide base ---------- */
  .slide{
    position:relative;width:100%;height:100%;overflow:hidden;
    background:var(--paper);padding:54px 70px 46px;
    display:flex;flex-direction:column;
    animation:deckIn .5s cubic-bezier(.22,1,.36,1) both;
  }
  .slide::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 96% 4%,rgba(129,114,232,.07),transparent 32%),
      radial-gradient(circle at 0% 100%,rgba(255,107,90,.055),transparent 35%);
  }
  .slide>*{position:relative;z-index:1}
  @keyframes deckIn{from{opacity:0;transform:translateY(12px) scale(.994)}to{opacity:1;transform:none}}
  .rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .slide-head{flex:0 0 auto;margin-bottom:22px}
  .eyebrow{
    display:flex;align-items:center;gap:10px;margin-bottom:13px;
    font-size:10.5px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;
    color:var(--accent,var(--coral));
  }
  .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px rgba(255,107,90,.14)}
  .slide-title{font-size:40px;line-height:1.08;letter-spacing:-.035em;font-weight:800;color:var(--ink)}
  .lead{margin-top:11px;font-size:15px;line-height:1.5;color:var(--ink-soft);max-width:930px}
  .slide-body{flex:1;min-height:0;display:flex;flex-direction:column}
  .slide-foot{
    flex:0 0 auto;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9AA3B2;
  }
  .slide-foot .mark{display:flex;align-items:center;gap:8px}
  .slide-foot .mark i{width:8px;height:8px;border-radius:2px;background:var(--coral);display:inline-block;transform:rotate(45deg)}

  .edge{
    position:absolute;top:50%;transform:translateY(-50%);z-index:5;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.65);color:var(--ink);font-size:25px;line-height:1;
    display:grid;place-items:center;opacity:0;transition:.25s ease;
  }
  .edge.prev{left:16px}.edge.next{right:16px}
  .slide:hover .edge{opacity:.65}.edge:hover{opacity:1 !important;transform:translateY(-50%) scale(1.08)}
  .edge.hidden{display:none}

  /* ---------- Dark slides ---------- */
  .slide.dark{background:linear-gradient(125deg,#0C1430 0%,#17204A 52%,#291C3E 100%);color:#fff}
  .slide.dark::before{
    background:
      radial-gradient(circle at 85% 10%,rgba(129,114,232,.22),transparent 42%),
      radial-gradient(circle at 8% 92%,rgba(245,185,66,.10),transparent 40%);
  }
  .slide.dark .slide-title,.slide.dark .eyebrow{color:#fff}
  .slide.dark .eyebrow{color:var(--amber)}
  .slide.dark .lead{color:rgba(255,255,255,.68)}
  .slide.dark .slide-foot{border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.5)}
  .slide.dark .edge{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);color:#fff}

  /* ---------- Cover ---------- */
  .cover{padding:58px 76px 46px}
  .cover-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:34px;align-items:center;flex:1}
  .cover-tag{
    display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;
    border:1px solid rgba(245,185,66,.35);background:rgba(245,185,66,.08);
    color:var(--amber);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  }
  .cover h1{font-size:60px;line-height:1.02;letter-spacing:-.05em;font-weight:800;margin:24px 0 18px;max-width:690px}
  .cover h1 em{font-style:normal;color:var(--amber)}
  .cover-sub{font-size:19px;line-height:1.45;color:rgba(255,255,255,.68);max-width:590px}
  .cover-teacher{margin-top:34px;display:flex;align-items:center;gap:13px;font-size:13.5px;color:rgba(255,255,255,.62)}
  .cover-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1A1736;background:linear-gradient(135deg,#F5B942,#FF8A6B)}
  .cover-meta{margin-top:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.36)}
  .cover-visual{position:relative;height:460px;display:grid;place-items:center}
  .cover-visual .ring{position:absolute;border:1px solid rgba(255,255,255,.12);border-radius:50%}
  .r1{width:420px;height:420px}.r2{width:310px;height:310px;border-style:dashed;opacity:.7}
  .cover-visual .glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(129,114,232,.34),transparent 68%);filter:blur(8px)}
  .phone{
    position:relative;width:222px;height:424px;border-radius:36px;padding:9px;
    background:linear-gradient(160deg,#34406A,#1B2444 55%,#121A36);
    box-shadow:0 32px 70px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .phone-screen{height:100%;border-radius:28px;background:linear-gradient(180deg,#0F1733,#1A2244);position:relative;overflow:hidden;padding:32px 16px 16px}
  .phone-notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:66px;height:7px;border-radius:99px;background:rgba(255,255,255,.16)}
  .phone-line{height:60px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:10px;position:relative;overflow:hidden}
  .phone-line::after{content:'';position:absolute;left:12px;right:12px;top:16px;height:7px;border-radius:9px;background:rgba(255,255,255,.16);box-shadow:0 16px 0 rgba(255,255,255,.09),0 32px 0 rgba(255,255,255,.07)}
  .phone-line.live{background:linear-gradient(120deg,rgba(255,107,90,.22),rgba(245,185,66,.10));border:1px solid rgba(255,107,90,.32)}
  .phone-live{position:absolute;top:14px;left:14px;font-size:8px;letter-spacing:.12em;color:#FF8A78;font-weight:800}
  .notif{
    position:absolute;z-index:3;display:flex;align-items:center;gap:9px;
    background:#fff;color:#1A2237;border-radius:13px;padding:9px 12px;
    font-size:11px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,.3);
    animation:float 5s ease-in-out infinite;
  }
  .notif b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px}
  .notif.a{top:52px;left:-30px;animation-delay:-.4s}
  .notif.b{top:170px;right:-48px;animation-delay:-1.8s}
  .notif.c{bottom:74px;left:-54px;animation-delay:-3.1s}
  .notif.d{bottom:24px;right:-32px;animation-delay:-2.4s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .cover-chip{position:absolute;bottom:8px;right:2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.42)}

  /* ---------- Slide 2: stats ---------- */
  .stats-wrap{display:grid;grid-template-columns:1.02fr .98fr;gap:20px;flex:1;min-height:0}
  .hero-stats{display:grid;grid-template-rows:1fr 1fr;gap:14px}
  .hero-stat{
    position:relative;overflow:hidden;border-radius:20px;padding:21px 25px;color:#fff;
    background:linear-gradient(125deg,#1D2947,#111A31);display:flex;flex-direction:column;justify-content:center;
  }
  .hero-stat.alt{background:linear-gradient(125deg,#2D6BAE,#1E447E)}
  .hero-stat .num{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.055em}
  .hero-stat .num small{font-size:24px;letter-spacing:-.02em}
  .hero-stat .desc{margin-top:8px;font-size:13px;line-height:1.42;color:rgba(255,255,255,.76);max-width:420px}
  .hero-stat .deco{position:absolute;right:-18px;bottom:-28px;font-size:118px;opacity:.10}
  .mini-list{display:flex;flex-direction:column;gap:12px}
  .mini-item{
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow);
  }
  .mini-ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#FFF0EC}
  .mini-item p{font-size:13px;line-height:1.42;color:var(--ink-soft)}
  .mini-item p strong{color:var(--ink)}
  .note-strip{
    margin-top:14px;flex:0 0 auto;border-radius:13px;padding:11px 16px;
    background:#ECF8F5;border:1px solid #CBE9E2;color:#146B62;
    font-size:12.5px;line-height:1.4;display:flex;gap:10px;align-items:center;
  }

  /* ---------- Slide 3: case ---------- */
  .case-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:38px;align-items:center;flex:1}
  .film-card{
    position:relative;border-radius:22px;padding:38px 40px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);
  }
  .film-card::before,.film-card::after{content:'';position:absolute;left:16px;right:16px;height:8px;opacity:.4;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 12px,transparent 12px 24px)}
  .film-card::before{top:9px}.film-card::after{bottom:9px}
  .film-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:800}
  .film-title{font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-.035em;margin-top:20px}
  .film-caption{margin-top:14px;font-size:13px;color:rgba(255,255,255,.55)}
  .film-actions{margin-top:26px;display:flex;align-items:center;gap:14px}
  .play{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font-size:17px;color:#fff;box-shadow:0 10px 26px rgba(255,107,90,.35)}
  .film-actions span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .question-card{border-radius:22px;padding:30px;background:linear-gradient(145deg,rgba(245,185,66,.14),rgba(255,107,90,.08));border:1px solid rgba(245,185,66,.28)}
  .q-mark{font-size:60px;line-height:.8;color:var(--amber);font-weight:800}
  .question-card h3{font-size:25px;line-height:1.22;margin:18px 0 14px;letter-spacing:-.02em}
  .question-card p{font-size:13px;line-height:1.5;color:rgba(255,255,255,.62)}
  .discuss{margin-top:22px;display:inline-flex;gap:8px;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:800}

  /* ---------- Two-column slides ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0}
  .duo-col{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--blue))}
  .duo-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .duo-badge{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;background:var(--soft,#EAF1FB);font-size:17px}
  .duo-head h3{font-size:18px;letter-spacing:-.02em}
  .duo-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .duo-item{background:var(--soft,#F3F6FA);border-radius:11px;padding:10px 12px;display:flex;gap:9px;font-size:12.3px;line-height:1.36;color:var(--ink-soft)}
  .duo-item .n{font-size:10px;font-weight:800;color:var(--c,var(--blue));padding-top:1px}
  .warning{
    margin-top:14px;flex:0 0 auto;background:#FFF7DC;border:1px solid #F1DB98;border-left:4px solid var(--amber);
    border-radius:13px;padding:12px 16px;display:flex;gap:11px;align-items:center;
  }
  .warning .ic{font-size:18px}
  .warning p{font-size:13px;line-height:1.4;color:#5C4715}
  .warning strong{color:#3F300C}

  /* ---------- Escalation ---------- */
  .stairs{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:end;flex:1;min-height:0;padding-top:6px}
  .step{
    position:relative;height:var(--h);background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);
    border-radius:17px;padding:15px 15px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  }
  .step::before{content:'↗';position:absolute;top:-13px;right:12px;width:23px;height:23px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:800}
  .step-level{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--c)}
  .step h3{font-size:14px;line-height:1.22;letter-spacing:-.015em;margin:7px 0 10px}
  .step ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .step li{position:relative;padding-left:13px;font-size:11.7px;line-height:1.33;color:var(--ink-soft)}
  .step li::before{content:'';position:absolute;left:0;top:.52em;width:5px;height:5px;border-radius:50%;background:var(--c)}
  .stairs-baseline{position:absolute;left:70px;right:70px;bottom:66px;height:1px;background:linear-gradient(90deg,transparent,rgba(20,27,46,.14),transparent)}

  /* ---------- Scenarios ---------- */
  .scenario-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;flex:1;min-height:0}
  .scenario{position:relative;background:#fff;border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:17px;padding:17px 20px;display:grid;grid-template-columns:48px 1fr;column-gap:14px;box-shadow:var(--shadow)}
  .scenario .ic{grid-row:span 2;width:48px;height:48px;border-radius:13px;background:#FFF0EF;display:grid;place-items:center;font-size:22px}
  .scenario .idx{position:absolute;right:17px;top:15px;font-size:9.5px;letter-spacing:.12em;font-weight:800;color:#B9C0CC}
  .scenario h3{font-size:15px;letter-spacing:-.015em;margin-bottom:7px;padding-right:44px}
  .scenario p{font-size:12.5px;line-height:1.43;color:var(--ink-soft)}

  /* ---------- Parents ---------- */
  .parent-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:14px;flex:1;min-height:0}
  .parent-card{grid-column:span 3;background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px 21px;display:flex;gap:15px;align-items:center;box-shadow:var(--shadow);border-bottom:4px solid var(--c,var(--blue))}
  .parent-card.small{grid-column:span 2;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px}
  .parent-ic{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--soft,#EAF1FB);display:grid;place-items:center;font-size:22px}
  .parent-card .txt{font-size:15px;line-height:1.35;font-weight:700;letter-spacing:-.015em}
  .parent-card.small .txt{font-size:12.8px;line-height:1.38}
  .parent-card .txt em{font-style:normal;color:var(--muted);font-weight:600}
  .parent-card.highlight{background:linear-gradient(135deg,#1E2A49,#141B2E);border-color:transparent;color:#fff}
  .parent-card.highlight .txt{color:#fff}
  .parent-card.highlight .txt em{color:rgba(255,255,255,.6)}
  .parent-card.highlight .parent-ic{background:rgba(245,185,66,.15)}

  /* ---------- Actions ---------- */
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
  .action{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:17px;padding:16px 19px;box-shadow:var(--shadow)}
  .action h3{font-size:15.5px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
  .action h3 .lv{font-size:9.5px;letter-spacing:.1em;color:var(--c);font-weight:800;border:1px solid var(--c);border-radius:99px;padding:3px 8px}
  .action ul{list-style:none;margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .action li{display:flex;gap:9px;font-size:12.5px;line-height:1.38;color:var(--ink-soft)}
  .action li .check{color:var(--teal);font-weight:800}
  .action-note{margin-top:12px;flex:0 0 auto;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:9px}
  .action-note b{color:var(--coral)}

  /* ---------- Phrases ---------- */
  .phrase-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:13px;flex:1;min-height:0}
  .phrase{position:relative;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:15px 17px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .qmark{font-size:30px;line-height:.7;color:var(--c);opacity:.42;font-weight:800}
  .phrase p{font-size:12.4px;line-height:1.43;font-style:italic;color:#2E3A50;margin-top:8px;flex:1}
  .phrase .note{margin-top:9px;padding-top:8px;border-top:1px solid #ECEFF3;font-size:10.8px;line-height:1.35;color:#8993A3}

  /* ---------- Q&A ---------- */
  .qa-list{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
  .qa-row{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:14px;padding:11px 16px;display:grid;grid-template-columns:30px 1fr;gap:13px;box-shadow:var(--shadow)}
  .qa-n{width:28px;height:28px;border-radius:9px;background:#EAF1FB;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800}
  .qa-row h3{font-size:14px;letter-spacing:-.015em}
  .qa-row p{margin-top:4px;font-size:12.2px;line-height:1.4;color:var(--ink-soft)}
  .qa-row p b{color:var(--teal)}

  /* ---------- Closing ---------- */
  .closing .slide-title{font-size:40px}
  .closing-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;min-height:0}
  .closing-col{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.13);border-radius:19px;padding:19px 22px}
  .closing-col h3{font-size:17px;margin-bottom:13px;display:flex;align-items:center;gap:10px;letter-spacing:-.015em}
  .closing-col ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  .closing-col li{display:flex;gap:10px;font-size:12.6px;line-height:1.42;color:rgba(255,255,255,.8)}
  .closing-col li span{color:var(--amber);font-weight:800}
  .closing-col.find li span{color:var(--coral)}
  .key-conclusion{
    margin-top:15px;flex:0 0 auto;border-radius:17px;padding:15px 20px;
    background:linear-gradient(105deg,#F5B942,#FF8B6B);color:#241B35;
    font-size:14.5px;line-height:1.45;font-weight:700;letter-spacing:-.01em;
  }
  .key-conclusion b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:5px;opacity:.7}
  .thanks{margin-top:11px;text-align:right;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5)}

  /* ---------- Controls ---------- */
  .controls{
    flex:0 0 72px;background:#0C1325;border-top:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 28px;
    box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:10;
  }
  .ctrl-group{display:flex;align-items:center;gap:8px}
  .nav-btn{
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#E7ECF6;
    border-radius:11px;padding:10px 15px;font-size:12px;font-weight:700;transition:.2s ease;
  }

      {q:'Как отличить эксперимент от угрозы?',a:'Эксперимент: есть контроль, адекватная реакция на просьбы. Угроза: нет фильтра, множество незнакомцев, неспособность остановиться.'},
      {q:'К кому обращаться?',a:'Школьный психолог → педагог-психолог → семейный консультант → полиция (при угрозах).'},

  {

/* ---------- Rendering helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function head(s){
  if(s.type === 'cover') return '';
  return `<div class="slide-head rise">
    <div class="eyebrow"><span class="eyebrow-dot"></span>${esc(s.eyebrow)}</div>
    <h1 class="slide-title">${esc(s.title)}</h1>
    ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ''}
  </div>`;
}
function foot(i){
  return `<div class="slide-foot">
    <span class="mark"><i></i> Групповая родительская консультация</span>
    <span>${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span>
  </div>`;
}

function coverBody(s){
  return `<div class="cover-grid rise">
    <div>
      <span class="cover-tag">● Родительская консультация</span>
      <h1>Вся жизнь напоказ<br><em>незнакомцам</em></h1>
      <p class="cover-sub">Что делать, если лайки важнее безопасности?</p>
      <div class="cover-teacher">
        <div class="cover-avatar">ШД</div>
        <div><div>Преподаватель: <b>Шайдулин Дмитрий</b></div><div class="cover-meta">Цифровая безопасность · Подростковая психология · Доверие в семье</div></div>
      </div>
    </div>
    <div class="cover-visual" aria-hidden="true">
      <div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div>
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <div class="phone-line"></div>
          <div class="phone-line live"><span class="phone-live">● LIVE</span></div>
          <div class="phone-line"></div>
          <div class="phone-line"></div>
        </div>
      </div>
      <div class="notif a"><b style="background:#FFE9E6">❤️</b> 12 новых лайков</div>
      <div class="notif b"><b style="background:#E8F0FF">👤</b> Подписался незнакомец</div>
      <div class="notif c"><b style="background:#FFF3D8">📍</b> «Где ты сейчас?»</div>
      <div class="notif d"><b style="background:#EEE9FF">📹</b> Эфир уже идёт</div>
      <div class="cover-chip">Публичное ↔ Приватное</div>
    </div>
  </div>`;
}

function statsBody(s){
  return `
  <div class="stats-wrap">
    <div class="hero-stats">
      <div class="hero-stat rise" style="--d:.05s">
        <div class="num">70<small> %</small></div>
        <div class="desc">подростков 13–17 лет ежедневно публикуют личный контент в социальных сетях</div>
        <div class="deco">📱</div>
      </div>
      <div class="hero-stat alt rise" style="--d:.1s">
        <div class="num">1 из 3</div>
        <div class="desc">подросток хотя бы раз делился информацией, которую позже хотел удалить</div>
        <div class="deco">🔓</div>
      </div>
    </div>
    <div class="mini-list">
      <div class="mini-item rise" style="--d:.14s"><div class="mini-ic">⚠️</div><p><strong>Гиперобщительность</strong> — коммуникативная девиация: потребность в признании подавляет критическое мышление и чувство безопасности.</p></div>
      <div class="mini-item rise" style="--d:.19s"><div class="mini-ic">🔺</div><p><strong>Без коррекции не остаётся на месте</strong> — эскалирует, порождая всё более опасные формы поведения.</p></div>
      <div class="mini-item rise" style="--d:.24s"><div class="mini-ic">🎯</div><p><strong>Задача консультации</strong> — показать, во что может перерасти безобидная на первый взгляд «общительность».</p></div>
    </div>
  </div>
  <div class="note-strip rise" style="--d:.3s"><span>💡</span><span>Ключевая мысль: проблема не в количестве общения, а в том, что гиперобщительность прогрессирует.</span></div>`;
}

function caseBody(s){
  return `<div class="case-grid">
    <div class="film-card rise">
      <div class="film-label">Фрагмент фильма</div>
      <div class="film-title">«Ингрид едет<br>на запад»</div>
      <div class="film-caption">Кейс для группового обсуждения</div>
      <div class="film-actions"><div class="play">▶</div><span>Разбор поведения героини</span></div>
    </div>
    <div class="question-card rise" style="--d:.12s">
      <div class="q-mark">?</div>
      <h3>К какому виду девиаций вы бы отнесли данный фрагмент?</h3>
      <p>Сопоставьте поведение героини с признаками гиперобщительности и предложите свою версию.</p>
      <div class="discuss">✦ Обсуждение в группе</div>
    </div>
  </div>`;
}

function duoBlock(s, c1, soft1, c2, soft2, warning){
  return `<div class="duo">
    <div class="duo-col rise" style="--c:${c1};--soft:${soft1};--d:.05s">
      <div class="duo-head"><div class="duo-badge">${s.leftIcon}</div><h3>${esc(s.leftTitle)}</h3></div>
      <div class="duo-list">${s.leftItems.map((t,i)=>`<div class="duo-item"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(t)}</span></div>`).join('')}</div>
    </div>
    <div class="duo-col rise" style="--c:${c2};--soft:${soft2};--d:.12s">
      <div class="duo-head"><div class="duo-badge">${s.rightIcon}</div><h3>${esc(s.rightTitle)}</h3></div>
      <div class="duo-list">${s.rightItems.map((t,i)=>`<div class="duo-item"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${esc(t)}</span></div>`).join('')}</div>
    </div>
  </div>
  <div class="warning rise" style="--d:.2s"><span class="ic">⚠️</span><p><strong>Главный парадокс.</strong> ${esc(warning)}</p></div>`;
}

function escalationBody(s){
  return `<div class="stairs">
    ${s.levels.map((l,i)=>`<div class="step rise" style="--c:${l.c};--h:${l.h}px;--d:${.05+i*.06}s">
      <div class="step-level">${esc(l.level)}</div>
      <h3>${esc(l.title)}</h3>
      <ul>${l.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    </div>`).join('')}
  </div>`;
}

function scenariosBody(s){
  return `<div class="scenario-grid">
    ${s.scenarios.map((t,i)=>`<div class="scenario rise" style="--d:${.05+i*.06}s">
      <div class="ic">${t.ic}</div>
      <div class="idx">СЦЕНАРИЙ ${String(i+1).padStart(2,'0')}</div>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.text)}</p>
    </div>`).join('')}
  </div>`;
}

function parentsBody(s){
  const cards = s.parentCards.map((c,i)=>`<div class="parent-card ${i>2?'small':''} ${c.highlight?'highlight':''} rise" style="--c:${c.c};--soft:${c.soft};--d:${.05+i*.05}s">
    <div class="parent-ic">${c.ic}</div><div class="txt">${c.txt}</div>
  </div>`).join('');
  return `<div class="parent-grid">${cards}</div>`;
}

function actionsBody(s){
  return `<div class="action-grid">
    ${s.levels.map((l,i)=>`<div class="action rise" style="--c:${l.c};--d:${.05+i*.06}s">
      <h3><span class="lv">${esc(l.lv)}</span>${esc(l.title)}</h3>
      <ul>${l.items.map(t=>`<li><span class="check">✓</span><span>${esc(t)}</span></li>`).join('')}</ul>
    </div>`).join('')}
  </div>
  <div class="action-note rise" style="--d:.3s"><b>✦</b> На каждом уровне сохраняем диалог и доверие — это главный инструмент,&nbsp;а не запреты и контроль.</div>`;
}

function phrasesBody(s){
  return `<div class="phrase-grid">
    ${s.phrases.map((p,i)=>`<div class="phrase rise" style="--c:${p.c};--d:${.04+i*.04}s">
      <div class="qmark">“</div>
      <p>${esc(p.text)}</p>
      <div class="note">→ ${esc(p.note)}</div>
    </div>`).join('')}
  </div>`;
}

function qaBody(s){
  return `<div class="qa-list">
    ${s.questions.map((q,i)=>`<div class="qa-row rise" style="--d:${.04+i*.05}s">
      <div class="qa-n">${String(i+1).padStart(2,'0')}</div>
      <div><h3>${esc(q.q)}</h3><p><b>Ответ:</b> ${esc(q.a)}</p></div>
    </div>`).join('')}
  </div>`;
}

function closingBody(s){
  return `<div class="closing-grid">
    <div class="closing-col find rise"><h3>📌 Что мы выяснили</h3><ul>${s.findings.map(t=>`<li><span>◆</span><span>${esc(t)}</span></li>`).join('')}</ul></div>
    <div class="closing-col rise" style="--d:.08s"><h3>🔮 Как применять</h3><ul>${s.application.map(t=>`<li><span>✓</span><span>${esc(t)}</span></li>`).join('')}</ul></div>
  </div>
  <div class="key-conclusion rise" style="--d:.16s"><b>🔑 Главный вывод</b>${esc(s.mainConclusion)}</div>
  <div class="thanks">Спасибо за внимание!</div>`;
}

function body(s){
  switch(s.type){
    case 'cover': return coverBody(s);
    case 'stats': return statsBody(s);
    case 'case': return caseBody(s);
    case 'twocolumns': return duoBlock(s,'#3D7BD9','#EAF1FB','#8172E8','#F1EEFF',s.warning);
    case 'escalation': return escalationBody(s);
    case 'scenarios': return scenariosBody(s);
    case 'parents': return parentsBody(s);
    case 'actions': return actionsBody(s);
    case 'phrases': return phrasesBody(s);
    case 'qa': return qaBody(s);
    case 'closing': return closingBody(s);
  }
  return '';
}

/* ---------- Navigation ---------- */
let current = 0;
function render(){
  const s = slides[current];
  const dark = ['cover','case','closing'].includes(s.type);
  $('deck').innerHTML = `<section class="slide ${dark?'dark':''} ${s.type}">
    ${head(s)}
    <div class="slide-body">${body(s)}</div>
    ${foot(current)}
    <button class="edge prev ${current===0?'hidden':''}" onclick="go(-1)" aria-label="Назад">‹</button>
    <button class="edge next ${current===slides.length-1?'hidden':''}" onclick="go(1)" aria-label="Вперёд">›</button>
  </section>`;
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = current === slides.length-1;
  $('counter').innerHTML = `<b>${String(current+1).padStart(2,'0')}</b> / ${slides.length}`;
  $('notesText').textContent = s.notes || 'Заметок для этого слайда нет.';
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('active', i===current);
    d.setAttribute('aria-current', i===current ? 'true':'false');
  });
  document.querySelectorAll('.ov-card').forEach((c,i)=>c.classList.toggle('current', i===current));
  scaleStage();
}
function go(step){
  const next = Math.min(slides.length-1,Math.max(0,current+step));
  if(next===current) return;
  current = next;
  render();
}
function jump(i){ current = Math.min(slides.length-1,Math.max(0,i)); closeOverview(); render(); }

function scaleStage(){
  const v = $('viewport');
  const scale = Math.min(v.clientWidth/1280, v.clientHeight/720);
  $('stage').style.transform = `translate(-50%,-50%) scale(${scale})`;
}

function toggleOverview(force){
  const ov = $('overview');
  const open = force !== undefined ? force : !ov.classList.contains('open');
  ov.classList.toggle('open',open);
}
function closeOverview(){ toggleOverview(false); }
function toggleNotes(force){
  const n = $('notes');
  const open = force !== undefined ? force : !n.classList.contains('open');
  n.classList.toggle('open',open);
  $('notesBtn').classList.toggle('on',open);
}
function toggleFull(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

/* ---------- Init ---------- */
$('dots').innerHTML = slides.map((s,i)=>`<button class="dot" onclick="jump(${i})" title="${esc(s.short||s.title)}" aria-label="Слайд ${i+1}: ${esc(s.short||s.title)}">${i+1}</button>`).join('');
$('ovGrid').innerHTML = slides.map((s,i)=>`<button class="ov-card" style="--c:${['#FF6B5A','#3D7BD9','#F5B942','#3D7BD9','#E9B93B','#E5484D','#8172E8','#20B2A5','#F08C4B','#D9549A','#3D7BD9','#F5B942'][i]}" onclick="jump(${i})">
  <span class="ov-num">СЛАЙД ${String(i+1).padStart(2,'0')}</span>
  <span class="ov-title">${esc(s.short||s.title)}</span>
</button>`).join('');

$('prevBtn').onclick = ()=>go(-1);
$('nextBtn').onclick = ()=>go(1);
$('overviewBtn').onclick = ()=>toggleOverview();
$('ovClose').onclick = closeOverview;
$('notesBtn').onclick = ()=>toggleNotes();
$('notesClose').onclick = ()=>toggleNotes(false);
$('fullBtn').onclick = toggleFull;
$('overview').addEventListener('click',e=>{ if(e.target===$('overview')) closeOverview(); });

window.addEventListener('resize',scaleStage);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ e.preventDefault(); jump(0); }
  else if(e.key==='End'){ e.preventDefault(); jump(slides.length-1); }
  else if(e.key.toLowerCase()==='o'){ toggleOverview(); }
  else if(e.key.toLowerCase()==='n'){ toggleNotes(); }
  else if(e.key.toLowerCase()==='f'){ toggleFull(); }
  else if(e.key==='Escape'){ closeOverview(); toggleNotes(false); }
});

render();
</script>
</body>
</html>
